spring:
  application:
    name: spring-ddd-example
  datasource:
    url: jdbc:h2:mem:spring-ddd-example;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true  # Erstellt EVENT_PUBLICATION-Tabelle für transaktionale Event-Verarbeitung (Outbox-Pattern)

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    urls:
      - name: Platzstruktur API
        url: /openapi/platzstruktur-api.yaml
      - name: Buchung API
        url: /openapi/buchung-api.yaml
